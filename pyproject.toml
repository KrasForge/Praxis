[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "praxis-runtime"
version = "0.1.0"
description = "Harness-independent process execution kernel"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.0", "mypy==1.18.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
